name: Relatorio de Desempenho

on:
  schedule:
    - cron: "*/30 * * * *"   # watcher: a cada 30min, le Gmail e atualiza o Supabase
    - cron: "30 10 * * *"    # notificacao manha (7:30 Brasilia) - unica que cria Solicitacao, dia 20
    - cron: "30 16 * * *"    # notificacao tarde (13:30 Brasilia) - so email, reenvia pra quem continua pendente
  workflow_dispatch:
    inputs:
      turno:
        description: "Turno (so usado se disparar a notificacao manualmente)"
        required: false
        default: manha
        type: choice
        options:
          - manha
          - tarde

jobs:
  watcher:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_RELATORIO_URL: ${{ secrets.SUPABASE_RELATORIO_URL }}
      SUPABASE_RELATORIO_SERVICE_KEY: ${{ secrets.SUPABASE_RELATORIO_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Restaurar credenciais Gmail
        run: |
          mkdir -p email
          printf '%s' '${{ secrets.GMAIL_CLIENT_SECRET_JSON }}' > email/client_secret.json
          printf '%s' '${{ secrets.GMAIL_TOKEN_JSON }}' > email/token.json

      - name: Verificar novos relatorios no Gmail
        run: python3 watch_relatorio_desempenho.py --max 500

  notificacao:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 10 * * *' || github.event.schedule == '30 16 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUBBLE_API_KEY_LIVE: ${{ secrets.BUBBLE_API_KEY_LIVE }}
      BUBBLE_AUTOMACAO_USER_ID_LIVE: ${{ secrets.BUBBLE_AUTOMACAO_USER_ID_LIVE }}
      SUPABASE_RELATORIO_URL: ${{ secrets.SUPABASE_RELATORIO_URL }}
      SUPABASE_RELATORIO_SERVICE_KEY: ${{ secrets.SUPABASE_RELATORIO_SERVICE_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
      BREVO_SENDER_NOME: ${{ secrets.BREVO_SENDER_NOME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Determinar turno da rodada
        id: turno
        run: |
          if [ "${{ github.event.schedule }}" = "30 10 * * *" ]; then
            echo "valor=manha" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 16 * * *" ]; then
            echo "valor=tarde" >> "$GITHUB_OUTPUT"
          else
            echo "valor=${{ github.event.inputs.turno }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checar relatorios pendentes e notificar gestores
        run: python3 check_relatorios_pendentes.py --env live --turno ${{ steps.turno.outputs.valor }}

      - name: Abrir ciclo de justificativa (so na rodada da manha, so age no 1o dia util do mes)
        if: steps.turno.outputs.valor == 'manha'
        run: python3 enviar_justificativa_atraso.py --env live

      - name: Fechar ciclos de justificativa concluidos e avisar coordenadores
        if: steps.turno.outputs.valor == 'manha'
        run: python3 enviar_analise_atrasos.py
